    <script>
        /* ===========================================================
           H2H SHL 2026/27 – byggd från originalsidans struktur.
           Behållet: matchinläsning, standings-snapshots, tidslinje,
           play/pause, long-press, export och grundlayout.
           =========================================================== */

        const tableStand = document.getElementById('tableStandings');
        const leagueStand = document.getElementById('leagueStandings');
        const roundButtons = document.getElementById('roundButtons');
        const exportBtn = document.getElementById('exportBtn');
        const timelineSlider = document.getElementById('timeline-slider');
        const currentStepDisplay = document.getElementById('current-step-display');
        const btnPrev = document.getElementById('step-prev');
        const btnNext = document.getElementById('step-next');
        const btnPlayPause = document.getElementById('play-pause');
        const playIcon = btnPlayPause?.querySelector('.play-icon');
        const pauseIcon = btnPlayPause?.querySelector('.pause-icon');
        const loadingBox = document.getElementById('tableLoading');
        const dataError = document.getElementById('dataError');
        const h2hSummary = document.getElementById('h2hSummary');

        /* ===========================================================
           DATAKÄLLOR
           =========================================================== */

        // Samma matchdata som i originalfilen.
        const TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQkjHeEnoc6HI08_yGHpxljc7alrzt9JAB-UrZ_T4niBz7Qcab5MFKhklojApa8J3JR6rv9DIzrHEtX/pub?gid=1247847413&single=true&output=tsv';

        // Samma team_id-/namnkälla som i originalfilen.
        const TEAMS_SHL_TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1h9aP4fYdNAZ5GO0M1wOzs657roYItrt9KRwfnZ5jgnQSvpFgLMpJMRhefNCcIf_PoWNhEJAUmozl/pub?gid=1219108197&single=true&output=tsv';

        // TODO: klistra in den publicerade TSV-adressen för fliken tips_shl_2026-2027.
        // Förväntade kolumner:
        // participant_id | display_name | tip_type | team_id | pick_rank | h2h_point_spread_tip
        const H2H_TIPS_TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdciZFc2htp9p0JXuGLqj9kjTANbZ8uTkgNz0mlnHYalLnao3lvSZDWS-q9qVsAlGAv_eam99UtdaU/pub?gid=530439256&single=true&output=tsv';

        const ROUND_STORAGE_KEY = 'round_shl_h2h_2026_2027';

        /* ===========================================================
           STATE / DATA
           =========================================================== */

        const state = {
            currentRound: null,
            latestRound: null,
            roundsAvailable: new Set()
        };

        let STANDING_SNAPSHOTS = new Map();
        let ALL_TEAMS_LONG = [];
        let TEAM_BY_ID = new Map();
        let TEAM_ID_BY_LONGNAME = new Map();
        let H2H_TIPS_BY_PARTICIPANT = new Map();

        let playbackTimer = null;
        const PLAYBACK_MS = 900;

        /* ===========================================================
           TSV / LAG / MATCHER
           =========================================================== */

        function parseTSV(text) {
            return String(text || '')
                .split(/\r?\n/)
                .filter(line => line.trim().length > 0)
                .map(line => line.split('\t').map(cell => cell.trim()));
        }

        function toInt(v) {
            const n = parseInt(v, 10);
            return Number.isFinite(n) ? n : null;
        }

        function isNum(v) {
            return typeof v === 'number' && Number.isFinite(v);
        }

        function standingsComparator(a, b) {
            if (b.points !== a.points) return b.points - a.points;
            if (b.gd !== a.gd) return b.gd - a.gd;
            if (b.gf !== a.gf) return b.gf - a.gf;
            return a.team.localeCompare(b.team, 'sv');
        }

        async function fetchText(url, label) {
            if (!url) throw new Error(`${label}: URL saknas.`);
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${label}: HTTP ${response.status}.`);
            return response.text();
        }

        async function loadTeamsFromTSV(url) {
            const rows = parseTSV(await fetchText(url, 'Lagdata'));
            if (!rows.length) throw new Error('Lagdata: inga rader hittades.');

            const hdr = rows[0].map(h => h.trim());
            const idx = name => hdr.findIndex(h => h.toLowerCase() === name.toLowerCase());

            const iId = idx('team_id');
            const iShort = idx('team_name_short');
            const iLong = idx('team_name_long');
            const iAbbr = idx('team_name_abbr');

            if (iId === -1 || iLong === -1) {
                throw new Error('Lagdata: team_id eller team_name_long saknas.');
            }

            TEAM_BY_ID.clear();
            TEAM_ID_BY_LONGNAME.clear();

            rows.slice(1).forEach(r => {
                const team_id = r[iId];
                if (!team_id) return;

                const obj = {
                    team_id,
                    team_name_abbr: iAbbr !== -1 ? r[iAbbr] : '',
                    team_name_short: iShort !== -1 ? r[iShort] : '',
                    team_name_long: iLong !== -1 ? r[iLong] : ''
                };

                TEAM_BY_ID.set(team_id, obj);
                if (obj.team_name_long) TEAM_ID_BY_LONGNAME.set(obj.team_name_long, team_id);
            });
        }

        async function loadH2HTipsFromTSV(url) {
            const rows = parseTSV(await fetchText(url, 'H2H-tips'));
            if (!rows.length) throw new Error('H2H-tips: inga rader hittades.');

            const hdr = rows[0].map(h => h.trim());
            const idx = name => hdr.findIndex(h => h.toLowerCase() === name.toLowerCase());

            const iParticipant = idx('participant_id');
            const iDisplay = idx('display_name');
            const iType = idx('tip_type');
            const iTeam = idx('team_id');
            const iRank = idx('pick_rank');
            const iPointSpreadTip = idx('h2h_point_spread_tip');

            const missing = [
                ['participant_id', iParticipant],
                ['display_name', iDisplay],
                ['tip_type', iType],
                ['team_id', iTeam],
                ['pick_rank', iRank],
                ['h2h_point_spread_tip', iPointSpreadTip]
            ].filter(([, i]) => i === -1).map(([name]) => name);

            if (missing.length) {
                throw new Error(`H2H-tips: saknar kolumn(er): ${missing.join(', ')}.`);
            }

            H2H_TIPS_BY_PARTICIPANT.clear();

            rows.slice(1).forEach(r => {
                if (String(r[iType] || '').toLowerCase() !== 'h2h') return;

                const participant_id = r[iParticipant];
                const display_name = r[iDisplay] || participant_id;
                const team_id = r[iTeam];
                const pick_rank = Number(r[iRank]);
                const pointSpreadRaw = r[iPointSpreadTip];
                const h2h_point_spread_tip = pointSpreadRaw === '' ? null : Number(pointSpreadRaw);

                if (!participant_id || !team_id || !Number.isFinite(pick_rank)) return;

                if (!H2H_TIPS_BY_PARTICIPANT.has(participant_id)) {
                    H2H_TIPS_BY_PARTICIPANT.set(participant_id, {
                        participant_id,
                        display_name,
                        h2h_point_spread_tip: Number.isFinite(h2h_point_spread_tip)
                            ? h2h_point_spread_tip
                            : null,
                        picks: []
                    });
                }

                const participant = H2H_TIPS_BY_PARTICIPANT.get(participant_id);
                if (!participant.display_name && display_name) participant.display_name = display_name;
                if (participant.h2h_point_spread_tip === null && Number.isFinite(h2h_point_spread_tip)) {
                    participant.h2h_point_spread_tip = h2h_point_spread_tip;
                }
                participant.picks.push({ team_id, pick_rank });
            });

            H2H_TIPS_BY_PARTICIPANT.forEach(participant => {
                participant.picks.sort((a, b) => a.pick_rank - b.pick_rank);
            });

            if (!H2H_TIPS_BY_PARTICIPANT.size) {
                throw new Error('H2H-tips: inga rader med tip_type = h2h hittades.');
            }
        }

        async function loadAndPrepareStandingsFromTSV(url) {
            const rows = parseTSV(await fetchText(url, 'Matchdata'));
            if (!rows.length) throw new Error('Matchdata: inga rader hittades.');

            const hdr = rows[0].map(h => h.trim());
            const idx = name => hdr.findIndex(h => h.toLowerCase() === name.toLowerCase());

            const iHomeTeam = idx('Hemmalag');
            const iAwayTeam = idx('Bortalag');
            const iHomeGoals = idx('Hemmamål');
            const iAwayGoals = idx('Bortamål');
            const iHomePts = idx('Hemmapoäng');
            const iAwayPts = idx('Bortapoäng');
            const iDate = idx('Datum');

            const required = [
                ['Hemmalag', iHomeTeam],
                ['Bortalag', iAwayTeam],
                ['Hemmamål', iHomeGoals],
                ['Bortamål', iAwayGoals]
            ].filter(([, i]) => i === -1).map(([name]) => name);

            if (required.length) {
                throw new Error(`Matchdata: saknar kolumn(er): ${required.join(', ')}.`);
            }

            const teamsSet = new Set();
            rows.slice(1).forEach(r => {
                if (r[iHomeTeam]) teamsSet.add(r[iHomeTeam]);
                if (r[iAwayTeam]) teamsSet.add(r[iAwayTeam]);
            });

            ALL_TEAMS_LONG = Array.from(teamsSet).sort((a, b) => a.localeCompare(b, 'sv'));

            const hist = new Map();
            ALL_TEAMS_LONG.forEach(team => {
                hist.set(team, [{ g: 0, points: 0, gf: 0, ga: 0, gd: 0 }]);
            });

            const dataRows = rows.slice(1);
            if (iDate !== -1) {
                dataRows.sort((a, b) => new Date(a[iDate]) - new Date(b[iDate]));
            }

            for (const r of dataRows) {
                const ht = r[iHomeTeam];
                const at = r[iAwayTeam];
                if (!ht || !at || !hist.has(ht) || !hist.has(at)) continue;

                const hg = toInt(r[iHomeGoals]);
                const ag = toInt(r[iAwayGoals]);
                const hp = iHomePts !== -1 ? toInt(r[iHomePts]) : null;
                const ap = iAwayPts !== -1 ? toInt(r[iAwayPts]) : null;

                const hHist = hist.get(ht);
                const aHist = hist.get(at);
                const prevH = hHist[hHist.length - 1];
                const prevA = aHist[aHist.length - 1];

                const nextH = {
                    g: prevH.g + 1,
                    points: prevH.points + (hp ?? (isNum(hg) && isNum(ag) ? (hg > ag ? 3 : 0) : 0)),
                    gf: prevH.gf + (isNum(hg) ? hg : 0),
                    ga: prevH.ga + (isNum(ag) ? ag : 0)
                };
                nextH.gd = nextH.gf - nextH.ga;

                const nextA = {
                    g: prevA.g + 1,
                    points: prevA.points + (ap ?? (isNum(hg) && isNum(ag) ? (ag > hg ? 3 : 0) : 0)),
                    gf: prevA.gf + (isNum(ag) ? ag : 0),
                    ga: prevA.ga + (isNum(hg) ? hg : 0)
                };
                nextA.gd = nextA.gf - nextA.ga;

                hHist.push(nextH);
                aHist.push(nextA);
            }

            const minTotalGames = ALL_TEAMS_LONG.length
                ? Math.min(...ALL_TEAMS_LONG.map(team => hist.get(team).length - 1))
                : 0;

            STANDING_SNAPSHOTS = new Map();
            state.roundsAvailable = new Set();

            for (let m = 0; m <= minTotalGames; m++) {
                const snapshot = ALL_TEAMS_LONG.map(team => {
                    const s = hist.get(team)[m];
                    return {
                        team,
                        g: s.g,
                        points: s.points,
                        gf: s.gf,
                        ga: s.ga,
                        gd: s.gd
                    };
                }).sort(standingsComparator);

                STANDING_SNAPSHOTS.set(m, snapshot);
                if (m > 0) state.roundsAvailable.add(m);
            }

            state.latestRound = minTotalGames || null;
        }

        /* ===========================================================
           H2H-LOGIK
           =========================================================== */

        function buildStandingsForRound(round) {
            const r = round === null ? 0 : round;
            const snapshot = STANDING_SNAPSHOTS.get(r);
            if (snapshot) return snapshot;

            return ALL_TEAMS_LONG.map(team => ({
                team, g: 0, points: 0, gf: 0, ga: 0, gd: 0
            })).sort((a, b) => a.team.localeCompare(b.team, 'sv'));
        }

        function buildActualRankByTeamId(standings) {
            const map = new Map();
            standings.forEach((row, index) => {
                const teamId = TEAM_ID_BY_LONGNAME.get(row.team);
                if (teamId) map.set(teamId, index + 1);
            });
            return map;
        }

        function isH2HTipCorrect(picks, actualRankByTeamId) {
            if (!Array.isArray(picks) || picks.length < 2) return false;

            let previousRank = -Infinity;

            for (const pick of picks) {
                const actualRank = actualRankByTeamId.get(pick.team_id);
                if (!Number.isFinite(actualRank)) return false;
                if (actualRank <= previousRank) return false;
                previousRank = actualRank;
            }

            return true;
        }

        function getDisplayTeamName(teamId) {
            const team = TEAM_BY_ID.get(teamId);
            return team?.team_name_short || team?.team_name_long || teamId;
        }

        function countCorrectRounds(picks, throughRound) {
            if (!Number.isFinite(throughRound) || throughRound <= 0) return 0;

            let correctRounds = 0;

            for (let round = 1; round <= throughRound; round++) {
                const snapshot = STANDING_SNAPSHOTS.get(round);
                if (!snapshot) continue;

                const rankMap = buildActualRankByTeamId(snapshot);
                if (isH2HTipCorrect(picks, rankMap)) correctRounds += 1;
            }

            return correctRounds;
        }

        function buildParticipantRows(actualRankByTeamId, standings, isStartMode, currentRound) {
            const rows = [];
            const roundsPlayed = isStartMode ? 0 : (Number(currentRound) || 0);

            H2H_TIPS_BY_PARTICIPANT.forEach(participant => {
                const picks = participant.picks || [];

                rows.push({
                    participant_id: participant.participant_id,
                    display_name: participant.display_name || participant.participant_id,
                    picks,
                    h2h_point_spread_tip: participant.h2h_point_spread_tip,
                    teamCount: picks.length,
                    correct: isStartMode ? null : isH2HTipCorrect(picks, actualRankByTeamId),
                    correctRounds: isStartMode ? 0 : countCorrectRounds(picks, roundsPlayed),
                    roundsPlayed
                });
            });

            if (isStartMode) {
                rows.sort((a, b) => a.display_name.localeCompare(b.display_name, 'sv'));
                return rows;
            }

            rows.sort((a, b) => {
                if (a.correct !== b.correct) return a.correct ? -1 : 1;

                if (a.correct && b.correct) {
                    if (b.teamCount !== a.teamCount) return b.teamCount - a.teamCount;
                    if (b.correctRounds !== a.correctRounds) return b.correctRounds - a.correctRounds;
                }

                return a.display_name.localeCompare(b.display_name, 'sv');
            });

            return rows;
        }

        /* ===========================================================
           DETALJVY – återanvänder originalets tooltip/popup
           =========================================================== */

        function buildTipperTooltipElement(row, standings, actualRankByTeamId, isStartMode) {
            const box = document.createElement('div');
            box.className = 'tipper-tooltip';
            box.setAttribute('role', 'tooltip');

            if (isStartMode) {
                const grid = document.createElement('div');
                grid.className = 'tt-grid';

                const colPick = document.createElement('div');
                colPick.className = 'tt-col';

                const headPick = document.createElement('div');
                headPick.className = 'tt-head';
                headPick.textContent = 'Tippad ordning';
                colPick.appendChild(headPick);

                const ol = document.createElement('ol');
                ol.className = 'h2h-pick-list';

                row.picks.forEach(pick => {
                    const li = document.createElement('li');
                    li.textContent = getDisplayTeamName(pick.team_id);
                    ol.appendChild(li);
                });

                colPick.appendChild(ol);
                grid.appendChild(colPick);
                box.appendChild(grid);

                const pointSpreadTip = document.createElement('p');
                pointSpreadTip.className = 'h2h-point-spread-tip';
                pointSpreadTip.textContent = Number.isFinite(row.h2h_point_spread_tip)
                    ? `Utslagsfråga: ${row.h2h_point_spread_tip} poäng`
                    : 'Utslagsfråga: —';
                box.appendChild(pointSpreadTip);

                return box;
            }

            const selected = new Set(row.picks.map(p => p.team_id));

            const grid = document.createElement('div');
            grid.className = 'tt-grid';

            const colActual = document.createElement('div');
            colActual.className = 'tt-col';

            const headActual = document.createElement('div');
            headActual.className = 'tt-head';
            headActual.textContent = 'Faktisk tabell';
            colActual.appendChild(headActual);

            const actualTable = document.createElement('table');
            actualTable.className = 'h2h-actual-table';

            const thead = document.createElement('thead');
            const hr = document.createElement('tr');
            ['Plats', 'Lag', 'P'].forEach((label, index) => {
                const th = document.createElement('th');
                th.textContent = label;
                if (index !== 1) th.className = 'num';
                hr.appendChild(th);
            });
            thead.appendChild(hr);

            const tbody = document.createElement('tbody');

            standings.forEach((standingRow, index) => {
                const teamId = TEAM_ID_BY_LONGNAME.get(standingRow.team);
                const tr = document.createElement('tr');

                if (teamId && selected.has(teamId)) {
                    tr.classList.add('selected-team');
                    if (row.correct === true) tr.classList.add('correct-pick');
                }

                const tdRank = document.createElement('td');
                tdRank.className = 'num';
                tdRank.textContent = String(index + 1);

                const tdTeam = document.createElement('td');
                tdTeam.textContent = teamId ? getDisplayTeamName(teamId) : standingRow.team;

                const tdPoints = document.createElement('td');
                tdPoints.className = 'num';
                tdPoints.textContent = String(standingRow.points);

                tr.append(tdRank, tdTeam, tdPoints);
                tbody.appendChild(tr);
            });

            actualTable.append(thead, tbody);
            colActual.appendChild(actualTable);
            grid.appendChild(colActual);

            if (row.correct === false) {
                const colPick = document.createElement('div');
                colPick.className = 'tt-col';

                const headPick = document.createElement('div');
                headPick.className = 'tt-head';
                headPick.textContent = 'Tippad ordning';
                colPick.appendChild(headPick);

                const ol = document.createElement('ol');
                ol.className = 'h2h-pick-list';

                row.picks.forEach(pick => {
                    const li = document.createElement('li');
                    li.textContent = getDisplayTeamName(pick.team_id);
                    ol.appendChild(li);
                });

                colPick.appendChild(ol);
                grid.appendChild(colPick);
            }

            box.appendChild(grid);

            const pointSpreadTip = document.createElement('p');
            pointSpreadTip.className = 'h2h-point-spread-tip';
            pointSpreadTip.textContent = Number.isFinite(row.h2h_point_spread_tip)
                ? `Utslagsfråga: ${row.h2h_point_spread_tip} poäng`
                : 'Utslagsfråga: —';
            box.appendChild(pointSpreadTip);

            return box;
        }

        function closeAllTipperPopups(except = null) {
            document.querySelectorAll('.tipper-tooltip-wrap.is-open').forEach(el => {
                if (el !== except) el.classList.remove('is-open');
            });
        }

        document.addEventListener('click', event => {
            const wrap = event.target.closest?.('.tipper-tooltip-wrap');

            if (wrap) {
                const willOpen = !wrap.classList.contains('is-open');
                closeAllTipperPopups(wrap);
                wrap.classList.toggle('is-open', willOpen);
                event.stopPropagation();
                return;
            }

            closeAllTipperPopups();
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeAllTipperPopups();
        });

        /* ===========================================================
           TOPPLISTA
           =========================================================== */

        function renderSummary(standings, isStartMode) {
            if (!h2hSummary) return;

            if (isStartMode || !standings.length) {
                h2hSummary.textContent = 'Ingen aktuell tabell ännu.';
                return;
            }

            const orderedNames = standings.map(row => {
                const teamId = TEAM_ID_BY_LONGNAME.get(row.team);
                return teamId ? getDisplayTeamName(teamId) : row.team;
            });

            const spread = standings[0].points - standings[standings.length - 1].points;

            h2hSummary.innerHTML =
                `<strong>Aktuell ordning:</strong> ${orderedNames.join(' → ')}<br>` +
                `<strong>Poängskillnad första–sista:</strong> ${spread}`;
        }

        function renderLeagueStandings(standings, isStartMode) {
            if (!leagueStand) return;

            const tbody = leagueStand.querySelector('tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            standings.forEach((standingRow, index) => {
                const tr = document.createElement('tr');
                const teamId = TEAM_ID_BY_LONGNAME.get(standingRow.team);

                const tdRank = document.createElement('td');
                tdRank.className = 'num';
                tdRank.textContent = isStartMode ? '—' : String(index + 1);

                const tdTeam = document.createElement('td');
                tdTeam.textContent = teamId ? getDisplayTeamName(teamId) : standingRow.team;

                const tdGames = document.createElement('td');
                tdGames.className = 'num';
                tdGames.textContent = isStartMode ? '—' : String(standingRow.g);

                const tdPoints = document.createElement('td');
                tdPoints.className = 'num';
                tdPoints.textContent = isStartMode ? '—' : String(standingRow.points);

                const tdGoalDiff = document.createElement('td');
                tdGoalDiff.className = 'num';
                tdGoalDiff.textContent = isStartMode
                    ? '—'
                    : `${standingRow.gd > 0 ? '+' : ''}${standingRow.gd}`;

                const tdGoalsFor = document.createElement('td');
                tdGoalsFor.className = 'num';
                tdGoalsFor.textContent = isStartMode ? '—' : String(standingRow.gf);

                tr.append(tdRank, tdTeam, tdGames, tdPoints, tdGoalDiff, tdGoalsFor);
                tbody.appendChild(tr);
            });
        }

        function renderTableForRound(round) {
            const isStartMode = round === null;
            const standings = buildStandingsForRound(round);
            renderLeagueStandings(standings, isStartMode);
            const actualRankByTeamId = isStartMode
                ? new Map()
                : buildActualRankByTeamId(standings);

            const rows = buildParticipantRows(actualRankByTeamId, standings, isStartMode, round);

            renderSummary(standings, isStartMode);

            const tbody = tableStand.querySelector('tbody');
            tbody.innerHTML = '';

            let correctSeen = 0;
            let lastCorrectRankKey = null;
            let dividerInserted = false;

            rows.forEach((row, index) => {
                const tr = document.createElement('tr');

                if (!isStartMode && row.correct === false && !dividerInserted && correctSeen > 0) {
                    tr.classList.add('h2h-divider');
                    dividerInserted = true;
                }

                const tdRank = document.createElement('td');

                if (isStartMode || row.correct !== true) {
                    tdRank.textContent = '';
                } else {
                    correctSeen += 1;

                    const rankKey = `${row.teamCount}|${row.correctRounds}`;

                    if (lastCorrectRankKey === null || rankKey !== lastCorrectRankKey) {
                        tdRank.textContent = String(correctSeen);
                        lastCorrectRankKey = rankKey;
                    } else {
                        tdRank.textContent = '';
                    }
                }

                const tdTipper = document.createElement('td');

                const wrap = document.createElement('span');
                wrap.className = 'tipper-tooltip-wrap';
                wrap.tabIndex = 0;
                wrap.setAttribute('role', 'button');
                wrap.setAttribute('aria-label', `Visa detaljer för ${row.display_name}`);

                const nameSpan = document.createElement('span');
                nameSpan.textContent = row.display_name;

                const tooltip = buildTipperTooltipElement(
                    row,
                    standings,
                    actualRankByTeamId,
                    isStartMode
                );

                wrap.append(nameSpan, tooltip);
                tdTipper.appendChild(wrap);

                const tdCount = document.createElement('td');
                tdCount.className = 'num';
                tdCount.textContent = String(row.teamCount);

                const tdCorrectRounds = document.createElement('td');
                tdCorrectRounds.className = 'num';
                tdCorrectRounds.textContent = `${row.correctRounds}/${row.roundsPlayed}`;

                const tdStatus = document.createElement('td');
                tdStatus.className = 'num h2h-status';

                if (isStartMode) {
                    tdStatus.textContent = '—';
                } else if (row.correct) {
                    tdStatus.textContent = 'Rätt';
                    tdStatus.classList.add('correct');
                } else {
                    tdStatus.textContent = 'Fel';
                    tdStatus.classList.add('incorrect');
                }

                tr.append(tdRank, tdTipper, tdCount, tdCorrectRounds, tdStatus);
                tbody.appendChild(tr);
            });

            console.log('[h2h][render]', {
                round,
                participants: rows.length,
                correct: rows.filter(r => r.correct === true).length
            });
        }

        /* ===========================================================
           TIDSLINJE – behåller originalbeteendet
           =========================================================== */

        function buildRoundButtons() {
            if (!roundButtons) return;
            roundButtons.innerHTML = '';

            const max = state.latestRound ?? 0;

            for (let r = 1; r <= Math.max(max, 1); r++) {
                const btn = document.createElement('button');
                btn.className = 'siffror-btn';
                btn.type = 'button';
                btn.dataset.round = String(r);

                const isAvailable = state.roundsAvailable.has(r);
                if (!isAvailable) btn.classList.add('inaktiv');

                btn.textContent = String(r);

                if (isAvailable) {
                    btn.addEventListener('click', () => {
                        stopPlayback();
                        timelineSlider.value = String(r);
                        applyRoundFromSliderValue();
                    });
                }

                roundButtons.appendChild(btn);
            }

            highlightSelectedRound();
        }

        function highlightSelectedRound() {
            roundButtons?.querySelectorAll('[data-round]').forEach(btn => {
                const r = Number(btn.dataset.round);
                const selected = state.currentRound === r;
                btn.classList.toggle('vald', selected);
                btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
            });
        }

        function renderCurrentStepLabel() {
            if (!currentStepDisplay || !timelineSlider) return;

            const value = Number(timelineSlider.value);

            currentStepDisplay.textContent = value === 0
                ? 'Startläge (0 matcher)'
                : `Efter ${value} matcher`;
        }

        function applyRoundFromSliderValue() {
            if (!timelineSlider) return;

            const value = Number(timelineSlider.value);

            try {
                localStorage.setItem(ROUND_STORAGE_KEY, String(value));
            } catch {}

            state.currentRound = value === 0 ? null : value;

            highlightSelectedRound();
            renderTableForRound(state.currentRound);
            renderCurrentStepLabel();
        }

        function restoreRoundFromLocalStorage() {
            if (!timelineSlider) return;

            const raw = localStorage.getItem(ROUND_STORAGE_KEY);
            const parsed = Number(raw);
            const value = Number.isFinite(parsed) ? parsed : 0;
            const max = Number(timelineSlider.max || '0');
            const clamped = Math.max(0, Math.min(value, max));

            timelineSlider.value = String(clamped);
            state.currentRound = clamped === 0 ? null : clamped;

            highlightSelectedRound();
            renderCurrentStepLabel();
        }

        function isPlaying() {
            return playbackTimer !== null;
        }

        function setPlayButtonUI(playing) {
            playIcon?.classList.toggle('hidden', playing);
            pauseIcon?.classList.toggle('hidden', !playing);

            if (btnPlayPause) {
                const label = playing ? 'Pausa' : 'Spela upp';
                btnPlayPause.setAttribute('aria-label', label);
                btnPlayPause.title = label;
            }
        }

        function stopPlayback() {
            if (playbackTimer) {
                clearInterval(playbackTimer);
                playbackTimer = null;
            }
            setPlayButtonUI(false);
        }

        function togglePlayback() {
            if (!timelineSlider) return;

            if (isPlaying()) {
                stopPlayback();
                return;
            }

            setPlayButtonUI(true);

            playbackTimer = setInterval(() => {
                const max = Number(timelineSlider.max || '0');
                let value = Number(timelineSlider.value);

                if (value >= max) {
                    stopPlayback();
                    return;
                }

                value += 1;
                timelineSlider.value = String(value);
                applyRoundFromSliderValue();
            }, PLAYBACK_MS);
        }

        function bindTimelineControls() {
            const LONG_PRESS_MS = 450;

            function clamp(n, min, max) {
                return Math.max(min, Math.min(max, n));
            }

            function stepTo(value) {
                timelineSlider.value = String(value);
                applyRoundFromSliderValue();
            }

            function bindStepButton(btn, direction) {
                if (!btn) return;

                let pressTimer = null;
                let longPressFired = false;

                const clearTimer = () => {
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                    }
                };

                btn.addEventListener('pointerdown', event => {
                    try { btn.setPointerCapture?.(event.pointerId); } catch {}

                    longPressFired = false;
                    clearTimer();

                    pressTimer = setTimeout(() => {
                        longPressFired = true;
                        stopPlayback();

                        const max = Number(timelineSlider.max || '0');
                        stepTo(direction < 0 ? 0 : max);
                    }, LONG_PRESS_MS);
                });

                btn.addEventListener('pointerup', () => {
                    const value = Number(timelineSlider.value || '0');
                    const max = Number(timelineSlider.max || '0');

                    clearTimer();

                    if (longPressFired) return;

                    stopPlayback();
                    stepTo(clamp(value + direction, 0, max));
                });

                btn.addEventListener('pointercancel', clearTimer);
                btn.addEventListener('pointerleave', clearTimer);
                btn.addEventListener('contextmenu', event => event.preventDefault());
            }

            bindStepButton(btnPrev, -1);
            bindStepButton(btnNext, 1);

            btnPlayPause?.addEventListener('click', togglePlayback);

            timelineSlider?.addEventListener('input', () => {
                stopPlayback();
                applyRoundFromSliderValue();
            });
        }

        /* ===========================================================
           EXPORT – samma princip som originalet
           =========================================================== */

        async function exportActiveView() {
            const activePanel = document.getElementById('viewTable');
            if (!activePanel) return;

            if (!window.html2canvas) {
                alert('html2canvas kunde inte laddas.');
                return;
            }

            document.documentElement.classList.add('exporting');

            const titled = activePanel.querySelectorAll('[title]');
            const savedTitles = [];
            titled.forEach(el => {
                savedTitles.push([el, el.getAttribute('title')]);
                el.removeAttribute('title');
            });

            try {
                const width = Math.max(1, Math.ceil(activePanel.scrollWidth || activePanel.offsetWidth || 0));
                const height = Math.max(1, Math.ceil(activePanel.scrollHeight || activePanel.offsetHeight || 0));

                const canvas = await html2canvas(activePanel, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: null,
                    width,
                    height,
                    windowWidth: width,
                    windowHeight: height,
                    scrollX: 0,
                    scrollY: 0
                });

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
                if (!blob) throw new Error('Kunde inte skapa PNG.');

                const a = document.createElement('a');
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');

                a.download =
                    `export-shl-h2h-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-` +
                    `${pad(now.getHours())}${pad(now.getMinutes())}.png`;

                a.href = URL.createObjectURL(blob);
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(a.href);
            } catch (error) {
                console.error('[export]', error);
                alert('Kunde inte exportera bilden. Se Console för detaljer.');
            } finally {
                savedTitles.forEach(([el, title]) => el.setAttribute('title', title));
                document.documentElement.classList.remove('exporting');
            }
        }

        /* ===========================================================
           INIT
           =========================================================== */

        function showError(message) {
            if (dataError) {
                dataError.textContent = message;
                dataError.classList.remove('hidden');
            }
        }

        async function init() {
            try {
                await loadTeamsFromTSV(TEAMS_SHL_TSV_URL);
                await loadAndPrepareStandingsFromTSV(TSV_URL);
                await loadH2HTipsFromTSV(H2H_TIPS_TSV_URL);

                timelineSlider.min = '0';
                timelineSlider.max = String(state.latestRound ?? 0);

                restoreRoundFromLocalStorage();
                buildRoundButtons();
                bindTimelineControls();

                exportBtn?.addEventListener('click', exportActiveView);

                renderTableForRound(state.currentRound);

                loadingBox?.classList.add('hidden');
                tableStand?.classList.remove('hidden');
                leagueStand?.classList.remove('hidden');
            } catch (error) {
                console.error('[init]', error);
                loadingBox?.classList.add('hidden');
                tableStand?.classList.add('hidden');
                leagueStand?.classList.add('hidden');
                showError(error.message || String(error));
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

    <script>
        // Mobilhjälp för ℹ️ – samma mekanik som originalet, med H2H-text.
        (function () {
            const mq = window.matchMedia('(max-width: 768px)');
            if (!mq.matches) return;

            function prepare(icon) {
                if (!icon || icon.dataset.mobileTipPrepared === '1') return;

                const mobileTip = icon.getAttribute('data-mobile-tip')
                    || 'Tryck på tipparens namn för att se detaljer.';

                icon.setAttribute('data-mobile-tip', mobileTip);

                if (!icon.getAttribute('aria-label')) {
                    icon.setAttribute('aria-label', mobileTip);
                }

                icon.removeAttribute('title');
                icon.dataset.mobileTipPrepared = '1';
            }

            function prepareAll() {
                document.querySelectorAll('.th-info').forEach(prepare);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', prepareAll, { once: true });
            } else {
                prepareAll();
            }

            document.addEventListener('click', event => {
                const icon = event.target.closest?.('.th-info');

                if (icon) {
                    prepare(icon);
                    document.querySelectorAll('.th-info.show-tip').forEach(el => {
                        if (el !== icon) el.classList.remove('show-tip');
                    });
                    icon.classList.toggle('show-tip');
                    event.stopPropagation();
                    return;
                }

                document.querySelector('.th-info.show-tip')?.classList.remove('show-tip');
            }, true);
        })();
    </script>
