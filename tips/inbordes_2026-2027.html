<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tippartopplista</title>

    <!-- html2canvas för export av aktiv vy -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        /* =========================================================
 0) DESIGN-TOKENS / VARIABLER
 ========================================================= */
        :root {
            --bg: #f4f4f9;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #6b7280;
            --accent: #007C30;
            --border: #e2e8f0;
            --row-hover: #f8faff;
            --header-bg: #f8fafc;

            /* OBS: dubletter – sista värdet vinner (behåll ordningen!)
           ⚠️ Om du “ändrar knapparnas gråa” och inget händer: du har troligen ändrat den FÖRSTA.
           Ändra de sista värdena i blocket nedan. */
            --btn-gray-bg: #f1f5f9;
            --btn-gray-hover: #e2e8f0;
            --btn-gray-bg: #f7f8fb;
            --btn-gray-hover: #eef2f7;

            /* en “rad” i topbaren */
            --ui-gap: 10px;

            /* ⚠️ OBS: --ui-row-h används senare (topbar-grid).
           Se till att den finns i filen (om den definieras någon annanstans: ok). */
            /* --ui-row-h: 42px; */
        }

        /* =========================================================
 1) BAS / RESET
 ========================================================= */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.45;
        }

        /* =========================================================
 2) HUVUDLAYOUT
 ========================================================= */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card);
            padding: 1rem 1rem 2rem;
        }

        header.page-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .5rem 1rem;
            margin-bottom: 1rem;
        }

        /* =========================================================
 3) LÄNKAR / KNAPPAR (generellt)
 ========================================================= */
        .ghost-link {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .35rem .8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            background: var(--card);
            font-weight: 600;
        }

        .ghost-link:hover {
            background: var(--header-bg);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .45rem .85rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            cursor: pointer;
            font-weight: 600;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn[disabled] {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =========================================================
 4) TABS
 ---------------------------------------------------------
 ⚠️ Tips: align-items (inte align-content) är det som oftast påverkar “center-känsla”
 i en enradig flex-rad. align-content påverkar primärt när rader wrap:ar.
 ========================================================= */
        .tabs {
            display: flex;
            align-items: center;
            gap: .6rem;
            flex-wrap: wrap;

            /* ✅ reservera höjd (sätts av JS) så reglaget hamnar identiskt */
            /* min-height: var(--tabs-reserve-h, auto); */

            /* align-content påverkar främst när flex-wrap skapar flera rader */
            align-content: center;
        }

        /* Tab-knappar (gäller både <button> och <a>) */
        .tab-btn {
            padding: .5rem .9rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--btn-gray-bg);
            cursor: pointer;
            font-weight: 700;

            /* 🔒 gör <a> och <button> identiska i “höjd-känsla” */
            font: inherit;
            line-height: 1;
            box-sizing: border-box;
            white-space: nowrap;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            /* gör inget för button, men tar bort underline för a */
            color: inherit;
        }

        /* Aktiv tab (button har aria-selected, länken har normalt inte det) */
        .tab-btn[aria-selected="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            cursor: default;
        }

        /* Snitt-länk */
        .tab-btn-link {
            /* Om du vill trimma Snitt, ändra här (annars: låt vara tomt) */
            /* font-size: .95rem; */
            /* padding: .45rem .85rem; */
            /* min-height: 2.2rem; */

            /* din aktiva override */
            padding: .6rem .9rem;
            /* lite mer upp/ner, samma i sidled som tab-btn */
        }

        /* Fin hover på “inaktiva” tabs */
        .tab-btn:hover:not([aria-selected="true"]) {
            background: var(--btn-gray-hover);
        }

        /* Allt extra i tab-raden (sourceFilter + rowColorControls) */
        .tabs #sourceFilter {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
        }

        /* Labels med input (radio/checkbox) på tab-raden */
        .tabs label,
        .tabs .rowcolor-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1;
        }

        /* Radios/checkboxar hamnar ofta lite off utan detta */
        .tabs input[type="checkbox"],
        .tabs input[type="radio"] {
            margin: 0;
            transform: translateY(1px);
        }

        /* =========================================================
 5) VYER (visa/dölj)
 ========================================================= */
        .views>section {
            display: none;
        }

        .views>section[aria-hidden="false"] {
            display: block;
        }

        /* =========================================================
 6) ACTIONS-RAD
 ========================================================= */
        .actions {
            display: flex;
            gap: .5rem;
            align-items: center;
            flex-wrap: wrap;
            margin: .5rem 0 1rem;
        }

        /* =========================================================
 7) SIFFERKNAPPAR (OMGÅNGAR)
 ========================================================= */
        /* Sifferknappar (omgångar) – döljer nu i och med att reglaget finns */
        .siffror-wrap {
            display: none;
        }

        .siffror-btn {
            display: inline-grid;
            place-items: center;
            min-width: 38px;
            height: 38px;
            padding: 0 .2rem;
            border-radius: 999px;
            border: 1px solid transparent;
            background: var(--btn-gray-bg);
            font-weight: 700;
            user-select: none;
            cursor: pointer;
        }

        .siffror-btn:hover {
            background: var(--btn-gray-hover);
        }

        .siffror-btn.vald {
            background: var(--accent);
            color: #fff;
            pointer-events: none;
        }

        .siffror-btn.inaktiv {
            background: var(--header-bg);
            color: var(--text-muted);
            opacity: .7;
            pointer-events: none;
        }

        .current-badge {
            font-size: .85em;
            font-weight: 700;
            white-space: nowrap;
        }

        @media (max-width: 560px) {
            .siffror-btn {
                min-width: 34px;
                height: 34px;
                font-size: .95rem;
            }
        }

        /* =========================================================
 8) TABELL (LIGATABELL)
 ========================================================= */
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            margin: 1rem auto 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: visible;
            /* tillåt tooltips att sticka ut */
            background: #fff;
        }

        thead,
        tbody {
            overflow: visible;
        }

        th,
        td {
            padding: .6rem .8rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        thead th {
            background: var(--header-bg);
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            font-size: .85rem;
            letter-spacing: .02em;
        }

        #tableStandings thead th.col-team {
            text-align: left;
        }

        /* Info-ikon i kolumnrubrik – BAS (kan override:as längre ner) */
        .th-info {
            margin-left: .35rem;
            color: var(--text-muted);
            font-weight: 900;
            cursor: help;
            user-select: none;

            position: relative;
            /* behövs för att mobil-tooltip ska kunna positioneras */
        }

        .th-info:hover {
            color: var(--text);
        }

        /* Endast på smal skärm: skapa en egen tooltip via pseudo-element */
@media (max-width: 768px) {
    .th-info::after {
        content: attr(data-mobile-tip);
        position: absolute;
        left: 50%;
        top: 120%;
        transform: translateX(-50%);

        width: min(32ch, calc(100vw - 2rem));
        white-space: normal;

        /* enkel "tooltip-look" */
        padding: .45rem .6rem;
        border-radius: 10px;
        font-size: .85rem;
        font-weight: 600;
        line-height: 1.2;

        background: rgba(20, 20, 20, .92);
        color: #fff;

        display: none;
        z-index: 9999;

        /* liten skugga */
        box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    }

    .th-info.show-tip::after {
        display: block;
    }
}



        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover {
            background: var(--row-hover);
        }

        .num {
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* Korrigera rundade hörn på tabellens övre header */
        #tableStandings thead tr:first-child th:first-child {
            border-top-left-radius: 10px;
        }

        #tableStandings thead tr:first-child th:last-child {
            border-top-right-radius: 10px;
        }

        #tableStandings thead th {
            background-clip: padding-box;
        }

        /* =========================================================
 9) SOURCE FILTER – BAS
 ---------------------------------------------------------
 ⚠️ BAS FÖR OVERRIDE
 - Default: hidden tills .is-visible
 - Förutsätter att ev. overrides ligger SENARE i filen

 ⚠️ VIKTIGT I DENNA FIL:
 - Denna BAS-logik “slås över” längre ner (sektion 23),
   där #sourceFilter tvingas alltid synlig i Topplista.
 - Om du felsöker “varför syns #sourceFilter ändå?” -> hoppa till sektion 23.
 ========================================================= */
        #sourceFilter {
            display: inline-flex;
            align-items: center;
            gap: .8rem;

            /* alltid plats i layouten */
            visibility: hidden;
            opacity: 0;
            pointer-events: none;

            /* undvik små höjdskillnader */
            min-height: 2.2rem;
        }

        #sourceFilter.is-visible {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        /* Kryssrutor: visa hobby/experter (alltid synliga) */
        #sourceFilter .source-options {
            display: inline-flex;
            align-items: center;
            gap: .75rem;
            margin-left: .75rem;
            padding-left: .75rem;
            border-left: 1px solid var(--border);
        }

        /* Bas-variant inne i #sourceFilter (snävare gap än global .source-options) */
        #sourceFilter .source-options label {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            white-space: nowrap;
        }

        /* Kompakt label + undvik radbrytning inne i varje alternativ */
        #sourceFilter label {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            white-space: nowrap;
        }

        /* Disabled-look för framtida/inaktivt placeringsläge
 (Legacy-stöd: om “Placering” återintroduceras ska det synas att valet inte är aktivt ännu.) */
        #sourceFilter.is-disabled-placement label[data-mode="placement"] {
            opacity: .45;
            filter: grayscale(1);
            cursor: help;
            /* hjälp-cursor på hela "Placering"-alternativet */
        }

        /* Viktigt: låt hover gå via labeln (så tooltipen funkar över både radio + text) */
        #sourceFilter.is-disabled-placement input[value="placement"] {
            pointer-events: none;
        }

        /* =========================================================
 10) HJÄLPTEXT / KÄLLRAD
 ========================================================= */
        .source {
            margin: 1rem auto 0;
            text-align: center;
            color: var(--text-muted);
            font-size: .85rem;
        }

        /* =========================================================
 11) TIDSLINJE (SLIDER)
 ========================================================= */
        .slider-wrapper {
            position: relative;
            margin: 1rem auto 0;
            width: 100%;
            padding: 1rem;
            background: var(--header-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .slider-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem 1rem;
            flex-wrap: wrap;
            margin-bottom: .75rem;
        }

        .slider-info {
            display: flex;
            align-items: baseline;
            gap: .75rem;
            flex-wrap: wrap;
        }

        #slider-label {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .02em;
            font-size: .85rem;
            color: var(--text-muted);
        }

        #current-step-display {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
            min-height: 1.2em;
        }

        .slider-controls {
            display: flex;
            gap: .5rem;
            align-items: center;
        }

        /* Mjuk hover/tryck-känsla bara för knapparna i spelaren */
        .slider-controls .btn {
            transition: transform .12s ease, box-shadow .15s ease, filter .15s ease, background .15s ease;
        }

        .slider-controls .btn:hover:not([disabled]) {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, .12);
            background: var(--btn-gray-hover);
        }

        .slider-controls .btn.primary:hover:not([disabled]) {
            filter: brightness(0.95);
        }

        .slider-controls .btn:active:not([disabled]) {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(0, 0, 0, .10);
        }

        .slider-controls .btn:focus-visible {
            outline: 2px solid rgba(0, 124, 48, .45);
            outline-offset: 3px;
        }

        /* Range – “appig” look */
        #timeline-slider {
            width: 100%;
            background: transparent;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        #timeline-slider::-webkit-slider-runnable-track {
            height: 10px;
            border-radius: 999px;
            background: #d5dbe7;
        }

        #timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -7px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid #fff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .08);
        }

        #timeline-slider::-moz-range-track {
            height: 10px;
            border-radius: 999px;
            background: #d5dbe7;
        }

        #timeline-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid #fff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .08);
        }

        /* =========================================================
 12) RADFÄRGER (TABELL) + PALETT
 ========================================================= */
        .rowcolor-controls.is-hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        #rowColorControls {
            display: inline-flex;
            align-items: center;
            gap: .8rem;

            min-height: 2.2rem;
            margin-left: auto;

            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        .rowcolor-toggle {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            font-weight: 600;
        }

        .rowcolor-scope {
            display: inline-flex;
            align-items: center;
            gap: .75rem;
        }

        .rowcolor-scope label {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            white-space: nowrap;
        }

        /* Reset-knapp (kommenterad) */
        /* #rowColorResetBtn { margin-left: auto; } */
        /* #rowColorResetBtn.is-hidden { visibility: hidden; opacity: 0; pointer-events: none; } */

        /* X: egen span */
        .btn-x {
            display: inline-grid;
            place-items: center;
            width: 1.15em;
            height: 1.15em;
            line-height: 1;
            font-size: 0.95em;
        }

        .rowcolor-palette {
            position: absolute;
            z-index: 9999;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: .5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
            width: max-content;
        }

        .rowcolor-swatches {
            display: flex;
            gap: .4rem;
            align-items: center;
            padding: .25rem;
        }

        .rowcolor-swatch {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, .12);
            cursor: pointer;
        }

        .rowcolor-swatch:hover {
            transform: translateY(-1px);
        }

        .rowcolor-clear {
            margin-top: .4rem;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: .4rem .6rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            cursor: pointer;
            font-weight: 600;
        }

        .rowcolor-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
        }

        .rowcolor-icon-btn:hover {
            background: var(--header-bg);
        }

        td.rowcolor-cell {
            padding: .45rem .45rem;
        }

        th[data-rowcolor] {
            position: relative;
        }

        th[data-rowcolor] #rowColorResetX {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
        }

        .summary-actions {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
        }

        .rowcolor-toggle--summary {
            margin-left: auto;
        }

        /* =========================================================
 13) EGET TIPS (CUSTOM) – panel + inmatning
 ========================================================= */
        .custom-panel {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin: 10px 0 14px 0;
            background: #fff;
            display: none;
            /* Styrs av JS/klassen .open */
            width: 100%;
        }

        .custom-panel.open {
            display: block;
        }

        .rank-panel-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        /* Denna container centrerar innehållet i mitten av skärmen */
        .custom-content-centered {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            /* Allt inuti (knappar/text) börjar till vänster */
            margin: 0 auto;
            /* Centrerar boxen horisontellt */
            width: 100%;
            max-width: 600px;
            /* Ändra här om du vill ha rutan bredare/smalare */
        }

        /* Textrutan */
        #custom-input {
            width: 100%;
            height: 280px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.35;
            resize: vertical;
            display: block;
            margin-bottom: 15px;
        }

        /* Knappraden */
        .custom-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
            width: 100%;
        }

        /* Meddelanden (Ok/Fel) */
        .custom-panel .msg {
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .custom-panel .msg.ok {
            color: #065f46;
        }

        .custom-panel .msg.err {
            color: #b91c1c;
        }

        /* Hjälptext (infällbar) */
        .custom-help {
            width: 100%;
            color: var(--text-muted);
            font-size: .95rem;
            line-height: 1.35;
            text-align: left;
        }

        .custom-help summary {
            cursor: pointer;
            user-select: none;
            font-weight: 700;
        }

        .custom-help[open] summary {
            margin-bottom: 6px;
        }

        .custom-help__body p {
            margin: 6px 0;
        }

        .custom-help__body ul {
            margin: 6px 0 10px 18px;
        }

        .custom-help__ex {
            margin: 6px 0 10px 0;
            padding: 8px 10px;
            border: 1px dashed var(--border);
            border-radius: 10px;
            background: #fafafa;
            overflow: auto;
        }

        /* Växla summary-text */
        .custom-help .when-open {
            display: none;
        }

        .custom-help[open] .when-open {
            display: inline;
        }

        .custom-help[open] .when-closed {
            display: none;
        }

        /* =========================================================
 14) RESPONSIVE: kontroller får ALDRIG svälla utanför skärmen
 ========================================================= */
        .controls,
        .controls-row {
            max-width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
        }

        .controls>*,
        .controls-row>* {
            min-width: 0;
            max-width: 100%;
        }

        .source-options {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            max-width: 100%;
        }

        /* Global variant (används i controls-row m.m. där .source-options kan förekomma) */
        .source-options label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        @media (max-width: 680px) {
            .source-options {
                width: 100%;
            }

            #btn-open-custom {
                flex: 0 0 auto;
                width: 42px;
            }

            .controls .divider,
            .controls-row .divider {
                display: none !important;
            }
        }

        /* =========================================================
 15) NAV-TOAST
 ========================================================= */
        .nav-toast {
            position: absolute;
            left: 0;
            right: 0;
            bottom: -0.2rem;
            text-align: center;

            font-size: .9rem;
            color: var(--text-muted);

            opacity: 0;
            transform: translateY(4px);
            transition: opacity .25s ease, transform .25s ease;

            pointer-events: none;
            z-index: 5;
        }

        .nav-toast.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 700px) {
            .nav-toast {
                bottom: .4rem;
                font-size: .85rem;
                padding: .35rem .7rem;
                border-radius: 999px;

                background: rgba(248, 250, 252, 0.92);
                border: 1px solid var(--border);

                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);

                box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            }
        }

        /* =========================================================
 16) TOPBAR – LAYOUT-GRID
 ---------------------------------------------------------
 ⚠️ STRUKTURELLT ORDNINGSKÄNSLIG
 - Definierar hela sidans layout-ryggrad
 - Förutsätter att ikon-/control-overrides kommer EFTER
 - Flytta inte utan att verifiera hela UI:t
 ========================================================= */
        .topbar {
            display: grid;
            grid-template-rows: var(--ui-row-h) var(--ui-row-h) calc(var(--ui-row-h) * 2);
            gap: var(--ui-gap);
            margin-bottom: 0.75rem;
        }

        .topbar-row--nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: var(--ui-row-h);
        }

        .topbar-nav {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            min-height: var(--ui-row-h);
        }

        /* Ikon-länkar: samma stil som ghost-link men kompakt */
        .icon-link {
            width: 42px;
            height: 42px;
            justify-content: center;
            padding: 0;
        }

        /* Gör 📸 lika stor klickyta som 🏠/📄 */
        .topbar-nav #exportBtn {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            border-radius: 12px;
            line-height: 1;
            cursor: pointer;
        }

        .topbar-nav #exportBtn:focus-visible {
            outline: 2px solid rgba(122, 162, 255, .45);
            outline-offset: 3px;
        }

        .topbar-row--tabs {
            min-height: var(--ui-row-h);
        }

        .topbar-row--controls {
            min-height: calc(var(--ui-row-h) * 2);
        }

        .view-controls-stack {
            display: grid;
            grid-template-columns: 1fr;
        }

        .view-controls-stack>#sourceFilter,
        .view-controls-stack>#rowColorControls {
            grid-area: 1 / 1;
            align-self: center;
        }

        /* =========================================================
 16B) SOURCE FILTER – TOPBAR LAYOUT-TWEAKS (inte synlighet!)
 ---------------------------------------------------------
 ⚠️ Detta block justerar WRAP/HÖJD/overflow för stack-layouten.
 Synlighet styrs i sektion 9 (BAS) och kan tvingas i sektion 23 (OVERRIDE).
 ========================================================= */
        #sourceFilter {
            min-height: var(--ui-row-h);

            /* Gör sourceFilter mer “mobilstabilt”: låt det wrappa men inte bli oändligt högt */
            flex-wrap: wrap;
            gap: 8px 12px;
            max-height: calc(var(--ui-row-h) * 2);
            overflow: visible;
        }

        /* Gör knappen kompaktare i sourceFilter */
        #btn-open-custom {
            padding: .45rem .65rem;
        }

        /* =========================================================
 17) UTILS
 ========================================================= */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
 18) TIPPER-TOOLTIP (tipslista 1..14)
 ========================================================= */
        .tipper-tooltip-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            cursor: help;
        }

        .tipper-tooltip-wrap:focus {
            outline: none;
        }

        .tipper-tooltip-wrap:focus-visible {
            outline: 2px solid rgba(0, 124, 48, .35);
            outline-offset: 3px;
            border-radius: 8px;
        }

        /* Själva rutan */
        .tipper-tooltip {
            position: absolute;
            top: calc(100% + .45rem);
            left: 0;
            z-index: 60;

            /* Krymp till innehåll (men aldrig större än viewport) */
            width: fit-content;
            max-width: calc(100vw - 2rem);

            /* ALDRIG klipp/ellipsis/radbrytning -> scrolla hellre horisontellt */
            overflow-x: auto;
            overflow-y: visible;

            padding: .6rem .75rem .6rem .25rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .12), 0 0 0 1px rgba(0, 0, 0, .06);

            color: var(--text);
            font-weight: 600;
            font-size: .92rem;

            opacity: 0;
            transform: translateY(4px);
            pointer-events: none;
            transition: opacity .12s ease, transform .12s ease;

            /* gör scrollen lite “diskret” */
            scrollbar-width: thin;
            /* Firefox */
        }

        /* Visa vid hover + fokus (keyboard-friendly) */
        .tipper-tooltip-wrap:hover .tipper-tooltip,
        .tipper-tooltip-wrap:focus-within .tipper-tooltip {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Innehåll: två tabeller sida vid sida */
        .tipper-tooltip .tt-grid {
            display: grid;
            grid-template-columns: max-content max-content;
            gap: .9rem;
            align-items: start;

            /* Viktigt: låt gridens bredd vara exakt “innehållsbredd” */
            width: max-content;
        }

        /* Varje “kolumn” */
        .tipper-tooltip .tt-col {
            width: max-content;
        }

        /* Rubriker */
        .tipper-tooltip .tt-head {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .02em;
            font-size: .78rem;
            color: var(--text-muted);
            margin: 0 0 .4rem 0;

            /* aligna rubriken med lagnamnskolumnen (förbi !-kolumnen) */
            padding-left: calc(1.1em + .45rem);
        }

        /* Gemensam ol-stil */
        .tipper-tooltip .tt-col ol {
            margin: 0;
            padding-left: 0;
            list-style: none;
            width: max-content;
        }

        /* Rader: ! | LAG | PIL+SIFFRA */
        .tipper-tooltip .tt-col li {
            display: grid;
            grid-template-columns: 1.1em auto 5.5ch;
            /* diff får egen kolumn */
            column-gap: .45rem;
            align-items: baseline;
        }

        /* Utropstecken-kolumn */
        .tipper-tooltip .tt-flag {
            display: inline-flex;
            justify-content: center;
            width: 1.1em;
            color: #b91c1c;
            font-weight: 900;
            line-height: 1;
        }

        /* Lagnamn: ALDRIG radbrytning, ALDRIG ellipsis */
        .tipper-tooltip .tt-team {
            white-space: nowrap;
            overflow: visible;
            text-overflow: clip;
        }

        /* Pilar+siffra: egen kolumn, tight men med lite luft */
        .tipper-tooltip .tt-diff {
            font-variant-numeric: tabular-nums;
            opacity: .9;
            white-space: nowrap;
            justify-self: end;
            /* snygg kolumnlinjering */
        }

        /* Mobil: stapla kolumner (men fortfarande inga radbrytningar i lagnamn) */
        @media (max-width: 520px) {
            .tipper-tooltip .tt-grid {
                grid-template-columns: 1fr;
                width: max-content;
            }
        }

        /* =========================================================
 19) IKON-TOGGLE (🎨)
 ========================================================= */
        .rowcolor-toggle--icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .06);
            cursor: pointer;
            position: relative;
            opacity: .9;
        }

        .rowcolor-toggle--icon input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .rowcolor-toggle--icon .toggle-icon {
            line-height: 1;
            font-size: 1.15rem;
        }

        .rowcolor-toggle--icon input:checked+.toggle-icon {
            transform: translateY(-.5px);
        }

        .rowcolor-toggle--icon:has(input:checked) {
            background: rgba(122, 162, 255, .18);
            border-color: rgba(122, 162, 255, .55);
            box-shadow: 0 0 0 2px rgba(122, 162, 255, .18) inset;
            opacity: 1;
        }

        .rowcolor-toggle--icon:has(input:checked)::after {
            content: "";
            position: absolute;
            top: 7px;
            right: 7px;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
        }

        /* =========================================================
 20) HEADER-IKONER – RESET / INTERAKTION
 ---------------------------------------------------------
 ⚠️ ORDNINGSKÄNSLIG
 - Måste ligga EFTER generella .btn / .icon-regler
 - Nollställer border/background/box-shadow medvetet
 - Hover/focus ska vinna över default-knappar
 ========================================================= */
        .topbar .icon-link,
        .topbar #exportBtn,
        .topbar .rowcolor-toggle--icon {
            border: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        .topbar-nav .icon-link,
        .topbar-nav #exportBtn {
            font-size: 1.15rem;
            line-height: 1;
        }

        .topbar #exportBtn {
            margin-left: 0px;
            cursor: pointer;
        }

        .topbar .rowcolor-toggle--icon:has(input:checked)::after {
            content: "";
            position: absolute;
            top: 7px;
            right: 7px;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
        }

        .topbar .rowcolor-toggle--icon:has(input:checked) {
            opacity: 1;
            filter: drop-shadow(0 0 6px rgba(122, 162, 255, .35));
        }

        /* =========================================================
 21) PLAIN IKONKNAPP – VISUELL UTILITY
 ========================================================= */
        .btn-icon-plain {
            width: 42px;
            height: 42px;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            line-height: 1;
            font-size: 1.15rem;
        }

        .btn-icon-plain:hover {
            background: rgba(255, 255, 255, .08);
        }

        .btn-icon-plain:focus-visible {
            outline: 2px solid rgba(122, 162, 255, .45);
            outline-offset: 3px;
        }

        .btn-icon-plain,
        .btn-icon-plain * {
            cursor: pointer;
        }

        .topbar-nav .icon-link:hover,
        .topbar #exportBtn:hover,
        .topbar .rowcolor-toggle--icon:hover,
        .topbar .rowcolor-toggle--icon:focus-within {
            background: rgba(15, 23, 42, 0.06) !important;
        }

        .source-item {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            position: relative;
        }

        /* =========================================================
 22) RESPONSIVE VISIBILITY: .m-tip (ℹ️)
 ========================================================= */
        .m-tip {
            display: none;
        }

        @media (max-width: 700px) {
            .m-tip {
                display: inline-block;
            }

            #sourceFilter {
                overflow: visible;
                max-height: none;
            }

            .m-tip>summary {
                list-style: none;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                line-height: 1;
                user-select: none;

                padding: .15rem .35rem;
                border-radius: 999px;
            }

            .m-tip>summary::-webkit-details-marker {
                display: none;
            }

            .m-tip__box {
                position: absolute;
                top: calc(100% + .4rem);
                left: 0;
                z-index: 50;

                width: max-content;
                max-width: min(36ch, calc(100vw - 2rem));
                white-space: normal;
                overflow-wrap: anywhere;

                padding: .55rem .65rem;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: var(--card, #fff);
                box-shadow: 0 12px 40px rgba(0, 0, 0, .12), 0 0 0 1px rgba(0, 0, 0, .06);
            }

            .m-tip:not([open]) .m-tip__box {
                display: none;
            }
        }

        /* =========================================================
 23) SOURCE FILTER – OVERRIDE (Topplista)
 ---------------------------------------------------------
 ⚠️ ORDNINGSKÄNSLIG SEKTION
 - Måste ligga EFTER “SOURCE FILTER – BAS”
 - Här tvingas synlighet: .is-visible i sektion 9 blir i praktiken irrelevant i Topplista.
 ========================================================= */
        #sourceFilter {
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        #sourceFilter .source-options {
            margin-left: 0 !important;
            padding-left: 0 !important;
            border-left: 0 !important;
        }

        /* =========================================================
 24) LOADING STATE – TOPPLISTA
 ========================================================= */
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .6rem;

            margin: 1.2rem auto 0;
            padding: 1.2rem 1.4rem;

            max-width: 420px;

            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--header-bg);

            font-weight: 700;
            color: var(--text-muted);
            text-align: center;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            animation: spin 0.9s linear infinite;
        }

        .loading-progress {
            font-size: .85rem;
            font-weight: 800;
            letter-spacing: .02em;
            color: var(--text);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===========================================================
 25) Rank-panel (Steg 4) – UI-skal för "Anpassa"
 =========================================================== */
        .rank-panel {
            margin: 10px 0 14px 0;
        }

        .rank-panel-inner {
            border: 1px solid var(--border, rgba(0, 0, 0, .12));
            border-radius: 12px;
            padding: 12px 12px;
            background: rgba(255, 255, 255, .75);
            backdrop-filter: blur(6px);

            /* ENDA ändringen: breddbegränsning + centrering */
            max-width: 500px;
            /* ← DENNA SIFFRA ändrar du senare */
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }


        .rank-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .rank-panel-title {
            font-weight: 800;
            letter-spacing: .2px;
        }

        .rank-panel-help summary {

            user-select: none;
            color: var(--text-muted);
            font-weight: 700;
            margin: 6px 0 6px 0;
        }

        .rank-panel-help-body {
            margin-top: 8px;
            color: var(--text);
            line-height: 1.35;

        .rank-panel-body .muted {

            font-size: .95rem;
        }

        /* =========================================================
 26) INFO-IKON (.th-info) – OVERRIDE
 ---------------------------------------------------------
 ⚠️ ORDNINGSKÄNSLIG
 - Denna sektion SKA ligga efter basregeln för .th-info
 - Överstyr bara opacity/font-size/position
 - (Färg/cursor kommer från basregeln i sektion 8)
 ========================================================= */
        .th-info {
            display: inline-block;
            opacity: .75;
            font-size: .95em;
            transform: translateY(-.5px);
        }

        .th-info:hover {
            opacity: 1;
        }

        /* ===========================================================
 27) Rank-panel – kolumnlista (Steg 5)
 =========================================================== */
        .rank-col-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .rank-col-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .rank-col-item:hover {
            background: rgba(0, 0, 0, .03);
            border-color: rgba(0, 0, 0, .08);
        }

        .rank-col-label {
            font-weight: 700;
        }

        .rank-col-item.inactive {
            opacity: .45;
        }

        .rank-col-actions {
            display: inline-flex;
            gap: 6px;
        }

        .rank-col-btn {
            border: none;
            background: none;
            cursor: pointer;
            font-size: .95rem;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 6px;
        }

        .rank-col-btn:hover {
            background: rgba(0, 0, 0, .08);
        }

        /* ===========================================================
 28) CTA-look för "Anpassa topplistan" (LAYOUT-NEUTRAL)
 -----------------------------------------------------------
 ⚠️ Ändra INTE padding/height/line-height här utan avsikt,
 eftersom knappen då kan “hoppa” eller rubba topbarens grid.

 OBS: var(--tab-padding-*) används med fallback här. Om du har ett system,
 definiera dem gärna i :root. Annars är det helt ok att de bara är fallback.
 =========================================================== */
        #btnCustomizeRank.tab-btn-customize {
            box-sizing: border-box;
            margin: 0;
            height: auto;
            line-height: inherit;
            padding: calc(var(--tab-padding-y, .45rem)) calc(var(--tab-padding-x, .85rem) + .35rem);
            white-space: nowrap;

            border: 1px solid rgba(0, 0, 0, .10);
            background: linear-gradient(180deg, rgba(255, 231, 155, .95), rgba(255, 201, 92, .95));
            color: rgba(0, 0, 0, .85);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .7),
                0 2px 10px rgba(0, 0, 0, .08);

            font-weight: 800;
            letter-spacing: .1px;
        }

        #btnCustomizeRank.tab-btn-customize:hover {
            filter: brightness(1.02);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .75),
                0 3px 14px rgba(0, 0, 0, .10);
        }

        #btnCustomizeRank.tab-btn-customize:active {
            transform: translateY(0);
            filter: brightness(.99);
        }

        #btnCustomizeRank .cta-spark {
            margin-right: .45rem;
            color: #d35400;
            text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
            opacity: .95;
        }

        #btnCustomizeRank.tab-btn-customize[aria-expanded="true"] {
            background: linear-gradient(180deg, rgba(255, 214, 120, .98), rgba(255, 178, 58, .98));
            border-color: rgba(0, 0, 0, .18);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .6),
                0 2px 10px rgba(0, 0, 0, .10);
        }

        #btnCustomizeRank.tab-btn-customize:focus-visible {
            outline: 2px solid rgba(0, 0, 0, .35);
            outline-offset: 2px;
        }
    
        /* =========================================================

           ========================================================= */
        .h2h-summary {

    <div class="container">

        <header class="topbar" aria-label="Kontroller">
