`;

                    let lastRankShown = null;

                    if (playersViewMode === "results") {
                        rows.forEach((item) => {
                            const playerId = item.playerId;
                            const countFirst = typeof item.count_first === "number" ? item.count_first : 0;

                            const rankText = (item.rank !== lastRankShown) ? `${item.rank}.` : "";
                            lastRankShown = item.rank;

                            html += `
  <tr>
    <td class="rank">${rankText}</td>
    <td>
      <span class="link-color players-link" data-player-id="${playerId}">
        ${TIPS.utils.getPlayerName(playerId)}
      </span>
    </td>
    <td><span class="cell-number-plain">${countFirst}</span></td>
  </tr>
`;
                        });
                    } else {
                        // POPULARITET-LÄGE
                        rows.forEach((item) => {
                            const playerId = item.playerId;
                            const tipsCount = typeof item.count === "number" ? item.count : 0;
                            const tippersCount = typeof item.uniqueTippersCount === "number" ? item.uniqueTippersCount : 0;

                            const rank = (typeof item.rank === "number") ? item.rank : null;
                            const rankText = (rank != null && rank !== lastRankShown) ? `${rank}.` : "";
                            lastRankShown = rank;

                            // VIKTIGT: samma klass som klick-lyssnaren letar efter
                            const tippersHtml = (tippersCount > 0)
                                ? `<span class="link-color players-tippers-link" data-player-id="${playerId}">${tippersCount} tippare</span>`
                                : `<span class="player-zero-tippers">0 tippare</span>`;

                            html += `
  <tr>
    <td class="rank">${rankText}</td>
    <td>
      <span class="link-color players-link" data-player-id="${playerId}">
        ${TIPS.utils.getPlayerName(playerId)}
      </span>
    </td>
    <td><span class="cell-number-plain">${tipsCount}</span></td>
    <td>${tippersHtml}</td>
  </tr>
`;
                        });
                    }


                    html += `
    </tbody>
  </table>
`;
                }

                el.innerHTML = html;

                // =========================
                // 3) Koppla UI-lyssnare (radio + ev checkbox)
                // =========================

                const radios = el.querySelectorAll('input[name="players-view-mode"]');
                radios.forEach(r => {
                    r.checked = (r.value === playersViewMode);
                    r.addEventListener("change", () => {
                        playersViewMode = r.value;
                        console.log("[players] playersViewMode =", playersViewMode);
                        renderPlayersView();
                    });
                });

                const cb = el.querySelector("#players-include-untipped");
                if (cb) {
                    cb.checked = playersIncludeUntipped;
                    cb.addEventListener("change", () => {
                        playersIncludeUntipped = cb.checked;
                        console.log("[players] playersIncludeUntipped =", playersIncludeUntipped);
                        renderPlayersView();
                    });
                }

                // =========================
                // 4) Klick: spelarnamn → player, (i popularity) tippare-count → player-tippers
                // =========================

                // Bind click-delegation EN gång (funkar både för <ul> och <table>)
                if (!el.dataset.playersClickBound) {
                    el.dataset.playersClickBound = "1";

                    el.addEventListener("click", (event) => {
                        // popularity: klick på tippare-count → player-tippers
                        const tippersLink = event.target.closest(".players-tippers-link");
                        if (tippersLink) {
                            const pid = tippersLink.getAttribute("data-player-id");
                            if (!pid) return;

                            console.log("[players] Klick på tippare-count → player-tippers:", pid);
                            appRouter.showView("player-tippers", { playerId: pid });
                            return;
                        }

                        // alla lägen: klick på spelarnamn → player (gäller även tabellen i contrib-läget)
                        const playerLink = event.target.closest(".players-link");
                        if (playerLink) {
                            const pid = playerLink.getAttribute("data-player-id");
                            if (!pid) return;

                            console.log("[players] Klick på spelarnamn → player:", pid);
                            appRouter.showView("player", { playerId: pid });
                        }
                    });
                }

            }



            function goBack() {
                if (viewHistory.length === 0) {
                    console.warn("[router] Ingen historik att gå tillbaka till");
                    return;
                }

                // Lägg nuvarande vy i forward-stacken
                if (currentView) {
                    forwardHistory.push({ view: currentView, params: currentParams });
                }

                const prev = viewHistory.pop();
                console.log("[router] goBack →", prev);

                suppressHistoryPush = true;
                showView(prev.view, prev.params || {});
                suppressHistoryPush = false;
            }

            function goForward() {
                if (forwardHistory.length === 0) {
                    console.warn("[router] Ingen historik att gå framåt till");
                    return;
                }

                // Lägg nuvarande vy i back-historiken
                if (currentView) {
                    viewHistory.push({ view: currentView, params: currentParams });
                }

                const next = forwardHistory.pop();
                console.log("[router] goForward →", next);

                suppressHistoryPush = true;
                showView(next.view, next.params || {});
                suppressHistoryPush = false;
            }



            function showView(viewName, params = {}) {
                // === Steg 3A: Spärra navigation tills data är färdig ===
                const TIPS = window.TIPS;
                if (!TIPS?.state?.isReady) {
                    console.warn("[router] Blockerad navigation – data laddas fortfarande:", viewName, params);
                    return;
                }

                console.log("[router] showView:", viewName, params);

                if (!VIEWS.includes(viewName)) {
                    console.warn("[router] Okänd vy:", viewName);
                    return;
                }
                // NYTT: spara föregående vy i historik (men inte vid första renderingen)
                if (!suppressHistoryPush && currentView && currentView !== viewName) {
                    viewHistory.push({ view: currentView, params: currentParams });
                }
                // NYTT: ny navigation nollställer framåt-historiken
                if (!suppressHistoryPush) {
                    forwardHistory.length = 0;
                }


                // NYTT: uppdatera "nuvarande"
                currentView = viewName;
                currentParams = params || {};

                // Rendera rätt vy innan vi visar den
                if (viewName === "start") {
                    renderStartView(params);
                } else if (viewName === "team") {
                    renderTeamView(params);
                } else if (viewName === "question") {
                    renderQuestionView(params);
                } else if (viewName === "question-player") {
                    renderQuestionPlayerView(params);
                } else if (viewName === "player") {
                    renderPlayerView(params);
                } else if (viewName === "player-tippers") {
                    renderPlayerTippersView(params);
                } else if (viewName === "tipper") {
                    renderTipperView(params);
                } else if (viewName === "players") {
                    renderPlayersView(params);
                } else if (viewName === "tippers") {
                    renderTippersView(params);
                } else if (viewName === "toplists") {
                    renderToplistsView(params);
                }



                // Visa/dölj alla vyer
                VIEWS.forEach((name) => {
                    const el = getViewElement(name);
                    if (!el) return;

                    if (name === viewName) {
                        el.classList.add("app-view--active");
                        console.log(`[router] Visar vy: ${name}`);
                    } else {
                        el.classList.remove("app-view--active");
                    }
                });

                updateBreadcrumbForView(viewName, params);
                // NYTT: enable/disable back-knapp
                const backBtn = document.getElementById("back-button");
                if (backBtn) {
                    backBtn.disabled = viewHistory.length === 0;
                }
                const forwardBtn = document.getElementById("forward-button");
                if (forwardBtn) {
                    forwardBtn.disabled = forwardHistory.length === 0;
                }


            }


            function updateBreadcrumbForView(viewName, params) {
                const activeTeamId = params?.teamId ?? window.TIPS?.state?.currentTeamId ?? null;

                const bc = document.getElementById("breadcrumb");
                if (!bc) return;

                const teamId = activeTeamId;
                const teamLabel = teamId != null ? TIPS.utils.getTeamLabel(teamId) : "Lag";

                // Separatorn som används mellan stegen
                const separator = '<span>›</span>';

                let html = "";
                switch (viewName) {
                    case "question": {
                        const pq = TIPS.data.processedQuestions();
                        const q = Array.isArray(pq)
                            ? pq.find(q => String(q.question_id) === String(params.questionId))
                            : null;
                        const title = q ? q.question_wording : "Okänd fråga";

                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-link" data-view="team" data-team-id="${teamId}">${teamLabel}</span>
                ${separator}
                <span class="breadcrumb-current">${title}</span>
            `;
                        break;
                    }
                    case "tipper": {
                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-link" data-view="team" data-team-id="${teamId}">${teamLabel}</span>
                ${separator}
                <span class="breadcrumb-link" data-view="tippers">Alla tippare</span>
                ${separator}
                <span class="breadcrumb-current">${params.tipperName || "Tippare"}</span>
            `;
                        break;
                    }
                    case "players":
                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-link" data-view="team" data-team-id="${teamId}">${teamLabel}</span>
                ${separator}
                <span class="breadcrumb-current">Alla spelare</span>
            `;
                        break;
                    case "tippers":
                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-link" data-view="team" data-team-id="${teamId}">${teamLabel}</span>
                ${separator}
                <span class="breadcrumb-current">Alla tippare</span>
            `;
                        break;
                    case "question-player": {
                        const pq = TIPS.data.processedQuestions();
                        const q = Array.isArray(pq) ? pq.find(x => String(x.question_id) === String(params.questionId)) : null;
                        const qTitle = q ? q.question_wording : "Fråga";
                        const pName = TIPS.utils.getPlayerName(params.playerId);

                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-link" data-view="team" data-team-id="${teamId}">${teamLabel}</span>
                ${separator}
                <span class="breadcrumb-link" data-view="question" data-question-id="${params.questionId}">${qTitle}</span>
                ${separator}
                <span class="breadcrumb-current">${pName}</span>
            `;
                        break;
                    }
                    case "player": {
                        const pName = TIPS.utils.getPlayerName(params.playerId);
                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-link" data-view="team" data-team-id="${teamId}">${teamLabel}</span>
                ${separator}
                <span class="breadcrumb-link" data-view="players" data-team-id="${teamId}">Alla spelare</span>
                ${separator}
                <span class="breadcrumb-current">${pName}</span>
            `;
                        break;
                    }
                    case "player-tippers": {
                        const pid = params?.playerId;
                        const pName = pid ? TIPS.utils.getPlayerName(pid) : "Okänd spelare";

                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-link" data-view="team" data-team-id="${teamId}">${teamLabel}</span>
                ${separator}
                <span class="breadcrumb-link" data-view="players" data-team-id="${teamId}">Alla spelare</span>
                ${separator}
                <span class="breadcrumb-link" data-view="player" data-player-id="${pid}" data-team-id="${teamId}">${pName}</span>
                ${separator}
                <span class="breadcrumb-current">Tippat på ${pName}</span>
            `;
                        break;
                    }
                    case "toplists":
                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-link" data-view="team" data-team-id="${teamId}">${teamLabel}</span>
                ${separator}
                <span class="breadcrumb-current">Topplista</span>
            `;
                        break;
                    case "team":
                        html = `
                <span class="breadcrumb-link" data-view="start">Välj lag</span>
                ${separator}
                <span class="breadcrumb-current">${teamLabel}</span>
            `;
                        break;
                    case "start":
                    default:
                        html = `<span class="breadcrumb-current">Välj lag</span>`;
                        break;
                }

                bc.innerHTML = html;
            }

            // NYTT: Klickbar breadcrumb – navigerar via showView
            const breadcrumbEl = document.getElementById("breadcrumb");
            if (breadcrumbEl) {
                breadcrumbEl.addEventListener("click", (event) => {
                    const link = event.target.closest(".breadcrumb-link");
                    if (!link) return;

                    const view = link.getAttribute("data-view");
                    console.log("[router] Breadcrumb-klick:", view);
                    // Försök ta lag från länken (data-team-id), annars fallback till "senast valda lag"
                    const teamId = link.getAttribute("data-team-id") ?? window.TIPS?.state?.currentTeamId ?? null;


                    switch (view) {
                        case "start":
                            appRouter.showView("start");
                            return;

                        case "team":
                            // Gå tillbaka till lagvyn för “senast valda lag”
                            appRouter.showView("team", { teamId });
                            return;

                        case "players":
                            appRouter.showView("players", teamId != null ? { teamId } : {});
                            return;

                        case "tippers":
                            appRouter.showView("tippers", teamId != null ? { teamId } : {});
                            return;

                        case "toplists":
                            appRouter.showView("toplists");
                            return;

                        case "question": {
                            const qId = link.getAttribute("data-question-id");
                            if (qId) appRouter.showView("question", { questionId: qId });
                            return;
                        }

                        case "player": {
                            const pid = link.getAttribute("data-player-id");
                            if (pid) appRouter.showView("player", { playerId: pid });
                            return;
                        }

                        default:
                            console.warn("[router] Okänt data-view i breadcrumb:", view);
                            return;
                    }


                });
            } else {
                console.warn("[router] Hittar inte #breadcrumb vid init av klicklyssnare");
            }


            // Gör routern nåbar via konsolen
            window.appRouter = { showView, goBack, goForward };


            // Kör router efter att sidan laddat
            document.addEventListener("DOMContentLoaded", () => {
                console.log("[router] DOMContentLoaded – kopplar lyssnare (visar INTE vy ännu)");

                // Viktigt: startvy visas först när init() är klar (Steg 4B).
                // appRouter.showView("start");

                const backBtn = document.getElementById("back-button");
                if (backBtn) {
                    backBtn.disabled = true; // startläge: ingen historik
                    backBtn.addEventListener("click", (event) => {
                        event.preventDefault();
                        goBack();
                    });
                }

                const forwardBtn = document.getElementById("forward-button");
                if (forwardBtn) {
                    forwardBtn.disabled = true; // startläge: ingen historik
                    forwardBtn.addEventListener("click", (event) => {
                        event.preventDefault();
                        goForward();
                    });
                }

                // Obs: start-knappen (#start-goto-modo) finns i startvyn och kommer först
                // när den renderats, så vi kopplar den i renderStartView senare (Steg 5).
            });

        })();
    </script>
