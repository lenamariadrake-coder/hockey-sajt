<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matcharkivet</title>
<style>
    body {
        font: 15px system-ui;
        background: #f4f6f8;
        color: #243341;
        margin: 0
    }

    main {
        max-width: 1500px;
        margin: auto;
        padding: 24px
    }

    h1 {
        margin: 0
    }

    section,
    details.panel {
        background: white;
        border: 1px solid #dce2e8;
        border-radius: 10px;
        padding: 14px;
        margin: 12px 0
    }

    button,
    input,
    select,
    textarea {
        font: inherit;
        border: 1px solid #bac7d0;
        border-radius: 5px;
        padding: 6px;
        background: white;
        color: inherit
    }

    button {
        cursor: pointer
    }

    button.active,
    button:hover {
        background: #d9eee9
    }

    summary {
        cursor: pointer;
        font-weight: 650
    }

    #filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px
    }

    #filters details {
        flex: 1 1 240px;
        border: 1px solid #ddd;
        border-radius: 7px;
        padding: 10px
    }

    .facet {
        margin: 9px 0
    }

    .choices {
        max-height: 145px;
        overflow: auto;
        border: 1px solid #eee;
        padding: 4px
    }

    .choices label {
        display: flex;
        gap: 5px;
        align-items: center
    }

    .choices small {
        margin-left: auto
    }

    .zero {
        color: #929ba4
    }

    .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 8px 0
    }

    #tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 8px
    }

    .tile {
        padding: 12px;
        text-align: center
    }

    .tile strong {
        display: block;
        font-size: 23px
    }

    .picked {
        outline: 3px solid #087f75
    }

    table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px
    }

    td,
    th {
        padding: 7px;
        border-bottom: 1px solid #ddd;
        text-align: left;
        white-space: nowrap
    }

    th input {
        width: 90px;
        display: block
    }

    th {
        background: #edf2f5
    }

    th button {
        border: 0;
        background: none;
        font-weight: bold
    }

    textarea {
        width: 98%;
        min-height: 130px
    }

    small {
        color: #65717b
    }

    .scroll {
        overflow: auto
    }

    #matrix td {
        text-align: center;
        cursor: pointer
    }

    .hidden {
        display: none !important
    }
</style>
<main>
    <h1>Matcharkivet</h1>
    <p>Avbytarnas avbytarbänk · Resultatbibliotek och historiska matcher</p>
    <div class="bar"><button id="live">Hämta aktuella data</button><label>Importera Games <input type="file" id="file"
                accept=".txt,.tsv,.csv"></label><small id="source"></small></div>
    <section><strong id="status"></strong>
        <div id="active"></div>
        <div class="bar"><button id="reset">Rensa huvudfilter</button><label><input type="checkbox" id="zeros"> Visa
                även alternativ utan träffar</label><button id="collapse">Fäll ihop filter</button><button
                id="expand">Fäll ut filter</button></div>
    </section>
    <section id="filters"></section>
    <section>
        <div class="bar"><button data-view="tiles">Resultatbrickor</button><button
                data-view="matrix">Resultatmatris</button><button data-view="list">Matchlista</button><select
                id="perspective">
                <option value="home">Hemma – Borta</option>
                <option value="away">Borta – Hemma</option>
                <option value="win">Vinnare – Förlorare</option>
                <option value="lose">Förlorare – Vinnare</option>
                <option value="team">Valt lag – Motståndare</option>
                <option value="opp">Motståndare – Valt lag</option>
            </select><label><input type="checkbox" id="split"> Separera avgöranden</label><label><input type="checkbox"
                    id="percent" checked> Procent</label><label><input type="checkbox" id="missing">
                Nollförekomster</label><input id="maxgoal" type="number" min="0" max="25" value="10" style="width:55px"
                title="Maxmål för nollförekomster"><select id="tileSort">
                <option value="freq">Vanligast</option>
                <option value="rare">Ovanligast</option>
                <option value="score">Resultat stigande</option>
                <option value="scoreDesc">Resultat fallande</option>
                <option value="total">Flest mål</option>
                <option value="totalAsc">Minst mål</option>
                <option value="margin">Störst marginal</option>
                <option value="marginAsc">Minst marginal</option>
            </select></div>
        <div class="bar"><span id="picked"></span><button id="showMatches">Visa markerade matcher</button><button
                id="clearPicked">Rensa resultatmarkering</button></div>
        <div id="tiles"></div>
        <div id="matrix" class="scroll"></div>
        <div id="list">
            <div class="bar"><span id="listCount"></span><button id="prev">‹</button><span id="page"></span><button
                    id="next">›</button><select id="pageSize">
                    <option>50</option>
                    <option>100</option>
                    <option>200</option>
                    <option>500</option>
                    <option value="999999">Alla</option>
                </select><button id="clearLocal">Rensa kolumnfilter</button><button id="copyRows">Kopiera TSV</button>
            </div>
            <div class="scroll" id="table"></div>
        </div>
    </section>
    <section id="detail"></section>
    <section>
        <h3>Export till Avancerat Deluxe</h3>
        <div class="bar"><select id="role">
                <option value="all">Alla inblandade</option>
                <option value="win">Vinnare</option>
                <option value="lose">Förlorare</option>
                <option value="home">Hemmalag</option>
                <option value="away">Bortalag</option>
                <option value="team">Valda lag</option>
            </select><button id="export">Skapa och kopiera lagsäsonger</button></div><textarea id="output"
            placeholder="Kopierbart urval"></textarea>
    </section>
    <details class="panel">
        <summary>Textkonfiguration</summary>
        <p>Ändra ordning genom att flytta rader. Minus döljer. Huvudfilter: kommaseparerade värden eller intervall.</p>
        <textarea id="config" style="min-height:350px"></textarea>
        <div class="bar"><button id="apply">Tillämpa</button><button id="copyConfig">Kopiera aktuell
                konfiguration</button><button id="complete">Komplettera saknade alternativ</button></div><small
            id="configMsg"></small>
    </details>
    <details class="panel">
        <summary>Prestandadiagnostik</summary>
        <pre id="diag"></pre>
    </details>
</main>
